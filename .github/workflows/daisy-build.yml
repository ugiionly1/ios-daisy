
name: Daisy XNU Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout ios-daisy
        uses: actions/checkout@v4

      - name: Checkout upstream XNU
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: xnu-8796.141.3
          path: xnu

      - name: Checkout AvailabilityVersions
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/AvailabilityVersions
          path: AvailabilityVersions

      - name: Check toolchain
        run: |
          xcodebuild -version
          clang --version
          make --version
          cmake --version
          ninja --version

      - name: Apply Daisy patch
        working-directory: xnu
        run: |
          git apply --check ../patches/daisy-build.patch
          git apply ../patches/daisy-build.patch

      - name: Build Apple availability tool
        run: |
          make -C AvailabilityVersions install

          AVAILABILITY_TOOL="AvailabilityVersions/dst/usr/local/libexec/availability.pl"

          test -x "$AVAILABILITY_TOOL"
          "$AVAILABILITY_TOOL" --ios
          "$AVAILABILITY_TOOL" --macosx

      - name: Install availability tool into SDK
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          AVAILABILITY_TOOL="AvailabilityVersions/dst/usr/local/libexec/availability.pl"

          sudo mkdir -p "$SDK/usr/local/libexec"
          sudo install -m 755 "$AVAILABILITY_TOOL" \
            "$SDK/usr/local/libexec/availability.pl"

      - name: Remove unsupported Clang flag
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("xnu")
          flag = "-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang"
          changed = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts or "BUILD" in path.parts:
                  continue

              try:
                  content = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue

              if flag in content:
                  path.write_text(content.replace(flag, ""))
                  changed.append(str(path))

          print("Files changed:")
          for path in changed:
              print(path)

          if not changed:
              print("Flag not found in source files.")
          PY

      - name: Diagnose SDK and headers
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"

          echo "=== SDK path ==="
          echo "$SDK"

          echo "=== SDK kernel include ==="
          ls -ld "$SDK/usr/local/include/kernel" || true

          echo "=== SDK private platform headers ==="
          ls -ld "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" || true

          echo "=== XNU exported headers ==="
          find xnu/BUILD/obj/EXPORT_HDRS -maxdepth 3 -type d -print 2>/dev/null || true

          echo "=== Kernel SDK directories ==="
          find /Library/Developer/KDKs -maxdepth 3 -type d -print 2>/dev/null || true
      
      - name: Check IIG
        run: |
          IIG="$(xcrun -sdk macosx -find iig)"
          echo "IIG path: $IIG"
          "$IIG" --version || true
      
      - name: Build Daisy XNU
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --find clang)"
          export CXX="$(xcrun --find clang++)"

          make -C xnu \
            TARGET_CONFIGS="DEVELOPMENT ARM64 DAISY" \
            exporthdrs all

      - name: Collect genassym diagnostics
        if: always()
        run: |
          echo "=== genassym reproduction scripts ==="
          find /var/folders -type f -name 'genassym-*.sh' \
            -exec sh -c 'echo "=== $1 ==="; cat "$1"' _ {} \; \
            2>/dev/null || true

          echo "=== generated preprocessed source ==="
          find /var/folders -type f -name 'genassym-*.c' \
            -exec ls -lh {} \; 2>/dev/null || true

          echo "=== Clang crash reports ==="
          find /Users/runner/Library/Logs/DiagnosticReports \
            -type f -name 'clang*.crash' \
            -print 2>/dev/null || true

          for file in /Users/runner/Library/Logs/DiagnosticReports/clang*.crash; do
            if [ -f "$file" ]; then
              echo "=== $file ==="
              head -n 120 "$file"
            fi
          done

      - name: Show build outputs
        if: always()
        run: |
          echo "=== XNU build outputs ==="
          find xnu/BUILD -type f \( \
            -name "kernel" -o \
            -name "*.bin" -o \
            -name "*.mach" \
          \) -print 2>/dev/null || true
